# Manual publish to public npm (run from the Actions tab → "Publish To NPM" → Run workflow).
#
# Requires ADOBE_BOT_NPM_TOKEN in repo secrets (request via Adobe Open Source Office:
# email Grp-opensourceoffice@adobe.com with the repo link).
#
# Before running: bump "version" in package.json on main, merge, then dispatch this workflow.
# We intentionally do not use push-triggered third-party publish actions (not supported for Adobe repos).

name: Publish To NPM
on: workflow_dispatch

jobs:
  publish-to-npm:
    name: "Publish to NPM"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js version
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: "npm"
          registry-url: "https://registry.npmjs.org"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: "Publish to NPM"
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ADOBE_BOT_NPM_TOKEN }}
